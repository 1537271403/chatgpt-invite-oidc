name: Deploy Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Create or reuse KV namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_TITLE: ${{ vars.CF_KV_NAMESPACE_TITLE || 'chatgpt-invite-oidc-kv' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          title = os.environ.get("CF_KV_NAMESPACE_TITLE") or "chatgpt-invite-oidc-kv"
          base = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/storage/kv/namespaces"
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          def request(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as r:
                  payload = json.load(r)
              if not payload.get("success"):
                  raise SystemExit(json.dumps(payload, indent=2))
              return payload

          found = None
          page = 1
          while True:
              url = base + "?" + urllib.parse.urlencode({"page": page, "per_page": 100})
              payload = request("GET", url)
              for ns in payload.get("result", []):
                  if ns.get("title") == title:
                      found = ns
                      break
              if found:
                  break
              info = payload.get("result_info") or {}
              if page >= int(info.get("total_pages") or 1):
                  break
              page += 1

          if not found:
              found = request("POST", base, {"title": title})["result"]

          kv_id = found["id"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"kv_id={kv_id}\n")
              f.write(f"kv_title={title}\n")
          print(f"KV namespace: {title} ({kv_id})")
          PY

      - name: Validate required GitHub Variables
        env:
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          ALLOWED_REDIRECT_URIS: ${{ vars.ALLOWED_REDIRECT_URIS }}
          ALLOWED_EMAIL_DOMAINS: ${{ vars.ALLOWED_EMAIL_DOMAINS }}
          ALLOWED_EMAIL_DOMAIN: ${{ vars.ALLOWED_EMAIL_DOMAIN }}
        run: |
          set -euo pipefail
          for name in OIDC_ISSUER ALLOWED_REDIRECT_URIS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub variable: $name" >&2
              echo "Refusing to deploy with empty OIDC config." >&2
              exit 1
            fi
          done
          if [ -z "${ALLOWED_EMAIL_DOMAINS:-}" ] && [ -z "${ALLOWED_EMAIL_DOMAIN:-}" ]; then
            echo "Missing required GitHub variable: ALLOWED_EMAIL_DOMAINS or legacy ALLOWED_EMAIL_DOMAIN" >&2
            echo "Refusing to deploy with empty OIDC config." >&2
            exit 1
          fi

      - name: Write wrangler.toml
        run: |
          cat > wrangler.toml <<'TOML'
          name = "${{ vars.CF_WORKER_NAME || 'chatgpt-invite-oidc' }}"
          main = "src/index.ts"
          compatibility_date = "2025-01-01"

          [vars]
          OIDC_ISSUER = "${{ vars.OIDC_ISSUER }}"
          OIDC_CLIENT_ID = "${{ vars.OIDC_CLIENT_ID || 'chatgpt-sso' }}"
          ALLOWED_REDIRECT_URIS = "${{ vars.ALLOWED_REDIRECT_URIS }}"
          ALLOWED_EMAIL_DOMAINS = "${{ vars.ALLOWED_EMAIL_DOMAINS || vars.ALLOWED_EMAIL_DOMAIN }}"
          TOKEN_TTL_SECONDS = "${{ vars.TOKEN_TTL_SECONDS || '3600' }}"
          CODE_TTL_SECONDS = "${{ vars.CODE_TTL_SECONDS || '300' }}"
          RATE_LIMIT_WINDOW_SECONDS = "${{ vars.RATE_LIMIT_WINDOW_SECONDS || '60' }}"
          RATE_LIMIT_MAX_ATTEMPTS = "${{ vars.RATE_LIMIT_MAX_ATTEMPTS || '10' }}"
          FAMILY_NAME = "${{ vars.FAMILY_NAME || 'Example' }}"

          [[kv_namespaces]]
          binding = "OIDC_KV"
          id = "${{ steps.kv.outputs.kv_id }}"
          TOML

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy

      - name: Set Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "Missing required GitHub secret: ADMIN_PASSWORD" >&2
            exit 1
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --config wrangler.toml
          if [ -n "${OIDC_CLIENT_SECRET:-}" ]; then
            printf '%s' "$OIDC_CLIENT_SECRET" | npx wrangler secret put OIDC_CLIENT_SECRET --config wrangler.toml
          fi
          if [ -n "${INVITE_CODE:-}" ]; then
            printf '%s' "$INVITE_CODE" | npx wrangler secret put INVITE_CODE --config wrangler.toml
          fi
