name = "chatgpt-invite-oidc"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Public, non-secret configuration. Copy to wrangler.toml and edit.
[vars]
OIDC_ISSUER = "https://sso.example.com"
OIDC_CLIENT_ID = "chatgpt-sso"
ALLOWED_REDIRECT_URIS = "https://external.auth.openai.com/sso/oidc/YOUR_CONNECTION_ID/callback"
ALLOWED_EMAIL_DOMAIN = "example.com"
FAMILY_NAME = "Example"
TOKEN_TTL_SECONDS = "3600"
CODE_TTL_SECONDS = "300"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_MAX_ATTEMPTS = "10"

# Create with: npx wrangler kv namespace create OIDC_KV
[[kv_namespaces]]
binding = "OIDC_KV"
id = "replace-with-your-kv-namespace-id"
